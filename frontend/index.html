<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookIt - College Facility &amp; Venue Booking System</title>
  
  <!-- Modern Clean Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- CSS Stylesheets (Deep Teal + Mint Theme) -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens.css" />
</head>
<body>
  <!-- Global Application Header & Navbar -->
  <header id="app-header" class="app-header"></header>

  <!-- Main Dynamic View Container -->
  <main id="app-main" class="app-main">
    <div id="app-view" class="screen-view">
      <!-- Dynamic Screens are injected here by router.js -->
    </div>
  </main>

  <!-- Global Application Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <div>
        <strong>BookIt</strong> &bull; College Classrooms, Seminar Halls &amp; Auditoriums
      </div>
      <div>
        <a href="slides.html" target="_blank" style="color: var(--primary); font-weight: 600; text-decoration: underline; margin-right: 1rem;">
          📊 Presentation Slides
        </a>
        <span>Frontend: Plain Vanilla JS &bull; HTML5 &bull; CSS3</span>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Application Bootstrap (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
